name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    # tgrep only ships via Homebrew today (see README), so we run on a runner
    # that has it preinstalled rather than trying to bootstrap it on Linux.
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install tgrep
        run: brew install tgrep

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
